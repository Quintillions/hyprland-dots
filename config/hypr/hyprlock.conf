# WALPURGISNACHT: HEXENWALD — Hyprlock
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
    color = rgb(111713)
}

# Horologium
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(D5D4C3)
    font_size = 96
    font_family = IM Fell English
    position = 0, 160
    halign = center
    valign = center
}

# Latin weekday and Roman date
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/hexenwald/bin/latin-date plain
    color = rgb(C4B99B)
    font_size = 18
    font_family = IM Fell English
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(927B4F)
    inner_color = rgb(202521)
    font_color = rgb(C4B99B)
    check_color = rgb(52664A)
    fail_color = rgb(C4705A)
    fade_on_empty = false
    rounding = 2
    font_family = IM Fell English
    placeholder_text = <i>Passwort</i>
    fail_text = <i>Falsch</i>
    position = 0, -40
    halign = center
    valign = center
}
